<div class="table-container">
    <table mat-table [dataSource]="weather" class="weather-table">

    <!-- City -->
    <ng-container matColumnDef="city">
        <th mat-header-cell *matHeaderCellDef>
        City
        </th>

        <td mat-cell *matCellDef="let item">
        <strong>{{ item.city }}</strong>
        </td>
    </ng-container>

    <!-- Temperature -->
    <ng-container matColumnDef="temperature">
        <th mat-header-cell *matHeaderCellDef>
        Temperature
        </th>

        <td mat-cell *matCellDef="let item">
        {{ item.temperature | number:'1.0-1' }} °C
        </td>
    </ng-container>

    <!-- Weather -->
    <ng-container matColumnDef="weather">
        <th mat-header-cell *matHeaderCellDef>Weather</th>

        <td mat-cell *matCellDef="let weather">
            <span class="weather-status">
            <span
                class="weather-icon"
                aria-hidden="true"
            >
                {{ getWeatherIcon(weather.weatherCode) }}
            </span>

            <span>
                {{ getWeatherDescription(weather.weatherCode) }}
            </span>
            </span>
        </td>
        </ng-container>

    <!-- Wind -->
    <ng-container matColumnDef="wind">
        <th mat-header-cell *matHeaderCellDef>
        Wind
        </th>

        <td mat-cell *matCellDef="let item">
        {{ item.windSpeed | number:'1.0-1' }} km/h
        </td>
    </ng-container>

    <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns">
    </tr>

    <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns">
    </tr>

    </table>
</div>
