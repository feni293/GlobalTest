name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend/angular-technical-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/angular-technical-test/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create production environment
        run: |
          cat > src/environments/environment.prod.ts <<EOF
          export const environment = {
            production: true,
            tmdbApiKey: '${{ secrets.TMDB_API_KEY }}',
            tmdbBaseUrl: 'https://api.themoviedb.org/3',
            tmdbImageUrl: 'https://image.tmdb.org/t/p/w500',
            weatherApiUrl: 'https://api.open-meteo.com/v1/forecast'
          };
          EOF

      - name: Build
        run: npm run build -- --base-href /GlobalTest/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Frontend/angular-technical-test/dist/angular-technical-test/browser

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4